name: Build & Deploy to ECS

on:
  push:
    branches: [master, main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ① 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # ② 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ③ 构建并推送后端镜像
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/todo-app-backend:latest

      # ④ 构建并推送前端镜像
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/todo-app-frontend:latest

      # ⑤ 原生命令 SSH 到 ECS，拉取新镜像并重启
      - name: Deploy to ECS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass > /dev/null 2>&1
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p ${{ secrets.SSH_PORT || '22' }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            cd ~/todo-app || { echo "ERROR: ~/todo-app not found!"; exit 1; }
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
          '
